name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # deploy-lambda.yml runs these tests before it deploys

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (PEP 8, ruff)
        run: uv run ruff check --output-format github .

      - name: Run unit tests
        if: success() || failure()   # still run the tests when only the lint step failed
        run: uv run pytest
