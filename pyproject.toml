[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-lake"
version = "3.0.0"
description = "Factor-based portfolio analysis and backtesting platform"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "boto3>=1.34.0",
    "numpy>=1.23",
    "openpyxl>=3.1.0",
    "pandas>=2.2.2",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=0.8.0",
    "supabase>=2.0.0",
    "streamlit>=1.55.0",
    "plotly>=5.17.0",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.4",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
]
# WRDS data pipeline (pipeline/); not installed by Streamlit Cloud. Run with `uv run --group pipeline`.
pipeline = [
    "numpy>=1.23",
    "pandas>=2.2.2",
    "pyarrow>=15.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "Visualizations*"]

[tool.ruff]
# PEP 8, with lines up to 120 characters (the code's existing width; see README "Code style")
line-length = 120
target-version = "py310"
# app/ modules import each other by bare name (e.g. `import streamlit_utils`)
src = [".", "app"]
# tests/fixtures/bad_code.py is deliberately bad code, a sample for the security scanners
extend-exclude = ["site", "factor_lake.egg-info", "tests/fixtures/bad_code.py"]

[tool.ruff.lint]
# pycodestyle errors and warnings (PEP 8), pep8-naming, and import order
select = ["E", "W", "N", "I"]

[tool.ruff.lint.per-file-ignores]
# Fake AWS clients in tests take boto3's own argument names (Bucket=, Key=, ...)
"tests/**" = ["N803"]
# Sets the Arrow memory pool and sys.path before anything imports pandas or the app's modules
"app/streamlit_app.py" = ["E402"]
# The package is named Visualizations; renaming it would change every import of it
"Visualizations/__init__.py" = ["N999"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "-p", "no:cacheprovider",
]
markers = [
    "unit: Unit tests (no external services required)",
    "integration: Integration tests (require Supabase credentials)",
    "slow: Tests that take longer to run",
    "fast: Quick tests that run fast",
]
minversion = "3.8"
